<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus Site</title>
<style>
  :root{
    color-scheme:light;
    --bg:#f6f7f9;
    --bg-soft:#eef1f5;
    --ink:#1b2330;
    --muted:#5c6778;
    --faint:#8b95a6;
    --card:#ffffff;
    --line:#e7eaf0;
    --line-soft:#eef1f5;
    --accent:#2f6bff;
    --accent-soft:#eef3ff;
    --pill:#f1f4f9;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
    --shadow-hover:0 2px 4px rgba(16,24,40,.06),0 18px 40px rgba(16,24,40,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;width:100%;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 100% -10%,#eef3ff 0,transparent 55%),
      radial-gradient(1000px 500px at -10% 110%,#f0fbf6 0,transparent 55%),
      var(--bg);
    padding:clamp(20px,4vw,56px);
    display:flex;flex-direction:column;
  }
  header{width:100%;margin:0 0 clamp(20px,3vw,34px)}
  .eyebrow{
    display:inline-flex;align-items:center;gap:7px;
    font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);
    border-radius:999px;padding:5px 12px;margin:0 0 14px
  }
  .eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  h1{font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
  .tag{color:var(--muted);font-size:clamp(14px,1.6vw,17px);margin:0;max-width:60ch}
  .meta{color:var(--faint);font-size:13px;margin-top:12px}
  main{width:100%;flex:1}
  .grid{
    width:100%;display:grid;gap:clamp(14px,1.6vw,22px);
    grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));
  }
  a.tile{
    position:relative;display:flex;flex-direction:column;
    text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:22px;
    padding:22px;box-shadow:var(--shadow);
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  }
  a.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:#d7deea}
  a.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .ico{
    width:52px;height:52px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    font-size:26px;background:var(--accent-soft);color:var(--ink);
    border:1px solid var(--line-soft);margin-bottom:16px;
  }
  .ext{position:absolute;top:20px;right:22px;color:var(--faint);font-size:14px}
  .nm{font-size:19px;font-weight:650;margin:0 0 6px;letter-spacing:-.01em}
  .ds{font-size:14px;color:var(--muted);line-height:1.5;margin:0}
  .tags{margin-top:16px;display:flex;gap:7px;flex-wrap:wrap}
  .tags span{
    font-size:12px;color:var(--muted);background:var(--pill);
    border-radius:999px;padding:4px 11px;
  }
  .err{
    width:100%;background:#fff5f6;border:1px solid #f3cdd4;
    border-radius:16px;padding:20px;color:#9b2740;font-size:14px;line-height:1.5;box-shadow:var(--shadow)
  }
  .err code{background:#fde8ec;border-radius:6px;padding:1px 6px}
  footer{width:100%;margin-top:clamp(26px,4vw,44px);color:var(--faint);font-size:13px}
  @media(prefers-reduced-motion:reduce){a.tile{transition:none}a.tile:hover{transform:none}}
</style>
</head>
<body>
  <header>
    <span class="eyebrow"><span class="dot"></span>Nexus</span>
    <h1 id="host">Nexus Site</h1>
    <p class="tag" id="tagline">Loading sites...</p>
    <p class="meta" id="meta"></p>
  </header>
  <main>
    <div class="grid" id="grid"></div>
  </main>
  <footer>Browser-powered games and tools. Hosted anywhere, including your Cardputer.</footer>
  <script>
    const esc = s => String(s).replace(/[&<>"]/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    fetch('metadata.json', {cache:'no-store'})
      .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(m => {
        document.title = m.host || 'Nexus Site';
        document.getElementById('host').textContent = m.host || 'Nexus Site';
        document.getElementById('tagline').textContent = m.tagline || '';
        document.getElementById('meta').textContent =
          'v' + (m.version ?? '?') + (m.updated ? ' - updated ' + m.updated : '');
        const grid = document.getElementById('grid');
        (m.sites || []).forEach(s => {
          const target = new URL(s.path || './', location.href);
          if (!['http:', 'https:'].includes(target.protocol)) return;
          const a = document.createElement('a');
          a.className = 'tile';
          a.href = target.href;
          const external = (s.path||'').startsWith('http');
          if (external) { a.target = '_blank'; a.rel = 'noopener'; }
          const tags = (s.tags||[]).map(t => '<span>'+esc(t)+'</span>').join('');
          a.innerHTML =
            (external ? '<div class="ext" title="Opens in a new tab">\u2197</div>' : '') +
            '<div class="ico">' + esc(s.icon || 'APP') + '</div>' +
            '<div class="nm">' + esc(s.name || 'Untitled') + '</div>' +
            '<div class="ds">' + esc(s.desc || '') + '</div>' +
            (tags ? '<div class="tags">' + tags + '</div>' : '');
          grid.appendChild(a);
        });
      })
      .catch(e => {
        document.getElementById('tagline').textContent = '';
        document.getElementById('grid').outerHTML =
          '<div class="err">Could not load <code>metadata.json</code> (' + esc(e.message) +
          '). Make sure it sits next to this file in your web root (or <code>/sites</code> on the SD card).</div>';
      });
  </script>
</body>
</html>
