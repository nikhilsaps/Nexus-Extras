<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus</title>
<style>
  :root{
    color-scheme:light;
    --bg:#fbfbfd;
    --ink:#0f1420;
    --muted:#616b7c;
    --faint:#9aa3b2;
    --card:#ffffff;
    --line:#ececf1;
    --line-2:#f3f4f8;
    --accent:#4f46e5;
    --accent-2:#6366f1;
    --accent-wash:#f1f1fe;
    --pill:#f4f5f8;
    --shadow:0 1px 2px rgba(15,20,32,.04),0 10px 30px rgba(15,20,32,.05);
    --shadow-hi:0 2px 6px rgba(15,20,32,.06),0 22px 48px rgba(15,20,32,.12);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;min-height:100vh;width:100%;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 480px at 92% -8%,#eef0ff 0,transparent 60%),
      radial-gradient(760px 420px at -6% 108%,#eafaf3 0,transparent 60%),
      var(--bg);
    padding:clamp(22px,4vw,60px);
    display:flex;flex-direction:column;
  }
  .brand{display:flex;align-items:center;gap:10px;margin:0 0 clamp(22px,3vw,36px)}
  .mark{
    width:34px;height:34px;border-radius:10px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:17px;letter-spacing:-.02em;
    box-shadow:0 6px 16px rgba(79,70,229,.3);
  }
  .brand b{font-size:15px;font-weight:700;letter-spacing:-.01em}
  header{width:100%;margin:0 0 clamp(24px,3vw,38px);max-width:72ch}
  h1{font-size:clamp(30px,4.4vw,46px);line-height:1.05;margin:0 0 10px;letter-spacing:-.03em;font-weight:800}
  .tag{color:var(--muted);font-size:clamp(15px,1.7vw,18px);margin:0;line-height:1.5}
  .meta{color:var(--faint);font-size:13px;margin-top:14px;display:flex;align-items:center;gap:8px}
  .meta .pt{width:5px;height:5px;border-radius:50%;background:var(--faint)}
  .group{width:100%}
  .group + .group{margin-top:clamp(30px,3.4vw,44px)}
  .section{display:flex;align-items:baseline;justify-content:space-between;width:100%;margin:0 0 14px}
  .section h2{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0}
  .count{font-size:13px;color:var(--faint)}
  main{width:100%;flex:1}
  .grid{
    width:100%;display:grid;gap:clamp(14px,1.5vw,20px);
    grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));
  }
  a.tile{
    position:relative;display:flex;flex-direction:column;overflow:hidden;
    text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:24px;
    padding:24px;box-shadow:var(--shadow);
    transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
  }
  a.tile::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    opacity:0;transition:opacity .2s ease;
  }
  a.tile:hover{transform:translateY(-5px);box-shadow:var(--shadow-hi);border-color:#dfe1ea}
  a.tile:hover::before{opacity:1}
  a.tile:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .ico{
    width:56px;height:56px;border-radius:18px;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:27px;
    background:linear-gradient(160deg,#ffffff,var(--accent-wash));
    border:1px solid var(--line-2);margin-bottom:18px;
    box-shadow:0 2px 8px rgba(15,20,32,.04);
  }
  .ext{position:absolute;top:22px;right:24px;color:var(--faint);font-size:15px;line-height:1}
  .nm{font-size:19px;font-weight:700;margin:0 0 6px;letter-spacing:-.015em}
  .ds{font-size:14px;color:var(--muted);line-height:1.55;margin:0;flex:1}
  .tags{margin-top:18px;display:flex;gap:7px;flex-wrap:wrap}
  .tags span{font-size:12px;color:var(--muted);background:var(--pill);border-radius:999px;padding:4px 11px}
  .err{
    width:100%;background:#fff6f7;border:1px solid #f4ccd3;border-radius:18px;
    padding:20px;color:#9a2740;font-size:14px;line-height:1.5;box-shadow:var(--shadow)
  }
  .err code{background:#fde8ec;border-radius:6px;padding:1px 6px}
  footer{width:100%;margin-top:clamp(28px,4vw,48px);color:var(--faint);font-size:13px}
  @media(prefers-reduced-motion:reduce){a.tile{transition:none}a.tile:hover{transform:none}}
</style>
</head>
<body>
  <div class="brand"><span class="mark">N</span><b>Nexus</b></div>
  <header>
    <h1 id="host">Nexus</h1>
    <p class="tag" id="tagline">Loading sites...</p>
    <p class="meta" id="meta"></p>
  </header>
  <main id="main">
    <section class="group" id="g-app" hidden>
      <div class="section"><h2>Apps</h2><span class="count" id="count-app"></span></div>
      <div class="grid" id="grid-app"></div>
    </section>
    <section class="group" id="g-tool" hidden>
      <div class="section"><h2>Tools</h2><span class="count" id="count-tool"></span></div>
      <div class="grid" id="grid-tool"></div>
    </section>
  </main>
  <footer>Served from a microSD card over your LAN. Works in any browser.</footer>
  <script>
    const esc = s => String(s).replace(/[&<>"]/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const tile = s => {
      const target = new URL(s.path || './', location.href);
      if (!['http:', 'https:'].includes(target.protocol)) return null;
      const a = document.createElement('a');
      a.className = 'tile';
      a.href = target.href;
      const external = (s.path || '').startsWith('http');
      if (external) { a.target = '_blank'; a.rel = 'noopener'; }
      const tags = (s.tags || []).map(t => '<span>' + esc(t) + '</span>').join('');
      a.innerHTML =
        (external ? '<div class="ext" title="Opens in a new tab">\u2197</div>' : '') +
        '<div class="ico">' + esc(s.icon || 'APP') + '</div>' +
        '<div class="nm">' + esc(s.name || 'Untitled') + '</div>' +
        '<div class="ds">' + esc(s.desc || '') + '</div>' +
        (tags ? '<div class="tags">' + tags + '</div>' : '');
      return a;
    };
    const label = (n, one, many) => n + ' ' + (n === 1 ? one : many);
    fetch('metadata.json', {cache:'no-store'})
      .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(m => {
        document.title = m.host || 'Nexus';
        document.getElementById('host').textContent = m.host || 'Nexus';
        document.getElementById('tagline').textContent = m.tagline || '';
        const meta = document.getElementById('meta');
        meta.innerHTML = 'v' + esc(String(m.version ?? '?')) +
          (m.updated ? '<span class="pt"></span>updated ' + esc(m.updated) : '');
        const groups = {
          app:  { grid: document.getElementById('grid-app'),  sec: document.getElementById('g-app'),  count: document.getElementById('count-app'),  one: 'app',  many: 'apps',  n: 0 },
          tool: { grid: document.getElementById('grid-tool'), sec: document.getElementById('g-tool'), count: document.getElementById('count-tool'), one: 'tool', many: 'tools', n: 0 }
        };
        (m.sites || []).forEach(s => {
          const g = groups[s.kind] || groups.app;
          const a = tile(s);
          if (!a) return;
          g.grid.appendChild(a);
          g.n++;
        });
        Object.values(groups).forEach(g => {
          if (g.n > 0) { g.sec.hidden = false; g.count.textContent = label(g.n, g.one, g.many); }
        });
      })
      .catch(e => {
        document.getElementById('tagline').textContent = '';
        document.getElementById('main').innerHTML =
          '<div class="err">Could not load <code>metadata.json</code> (' + esc(e.message) +
          '). It must sit next to this file in <code>/sites</code> on the SD card.</div>';
      });
  </script>
</body>
</html>
