<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes - LocalServe demo</title>
<style>
  body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:#0b1020;
    color:#e7ecf5;padding:32px 20px}
  main{max-width:560px;margin:0 auto}
  h1{font-size:23px}
  .back{display:inline-block;margin-bottom:18px;color:#9fb0d4;text-decoration:none}
  textarea{width:100%;min-height:200px;background:#141b33;color:#e7ecf5;
    border:1px solid #243055;border-radius:12px;padding:14px;font:14px/1.5 inherit;resize:vertical}
  p{color:#9fb0d4;font-size:13px}
  code{background:#141b33;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<main>
  <a class="back" href="/">&larr; Back to launcher</a>
  <h1>Notes</h1>
  <p>A sample sub-site living in its own folder (<code>/sites/notes/</code>),
     linked from the manifest as <code>/notes/index.html</code>.</p>
  <textarea placeholder="Scratch space... (this demo does not persist; the firmware exposes PUT/POST /api/save/&lt;path&gt; if you want to wire up saving)"></textarea>
</main>
</body>
</html>
